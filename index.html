<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>预览访问验证</title><style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;
display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:30px 34px;text-align:center;width:320px}
h1{font-size:17px;margin:0 0 6px}p{color:#94a3b8;font-size:13px;margin:6px 0 18px}
input{width:100%;padding:11px;font-size:18px;letter-spacing:6px;text-align:center;border-radius:9px;
border:1px solid #334155;background:#0f172a;color:#e2e8f0;outline:none}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:9px;background:#38bdf8;color:#0f172a;
font-size:15px;font-weight:600;cursor:pointer}
.err{color:#f87171;font-size:12px;height:16px;margin-top:8px}
</style></head><body><div class="box">
<h1>请输入访问密码</h1><p>该预览页需要密码才能查看</p>
<input id="pw" inputmode="numeric" maxlength="6" placeholder="••••••" autofocus>
<button onclick="check()">进入预览</button>
<div class="err" id="err"></div></div>
<script>
var SECRET=btoa("208418");
function check(){
  var v=document.getElementById('pw').value.trim();
  if(btoa(v)===SECRET){location.href="https://Linjieqiong001.github.io/hainan-merchant-admin/%E6%B5%B7%E5%8D%97%E5%87%BA%E6%B5%B7%E6%9C%8D%E5%8A%A1%E5%B9%B3%E5%8F%B0_%E5%95%86%E5%AE%B6%E4%BC%81%E4%B8%9A%E7%AE%A1%E7%90%86%E5%90%8E%E5%8F%B0_%E9%AB%98%E4%BF%9D%E7%9C%9F%E5%8E%9F%E5%9E%8B.html";}
  else{document.getElementById('err').textContent='密码错误，请重试';}
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
</script></body></html>
